# fly.toml — uod-backend deployment config
# Run `fly launch --copy-config --no-deploy` against this file to create the
# app, then `fly secrets set DATABASE_URL=... NEXTAUTH_SECRET=...` before
# the first deploy. The CI workflow at .github/workflows/deploy.yml pushes
# new images on every commit to main once FLY_API_TOKEN is set.

app = "uod-backend"
primary_region = "iad"   # change to a region near your Studio/Netlify deploy
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]

[env]
  PORT = "8080"
  ENVIRONMENT = "production"

# DATABASE_URL and NEXTAUTH_SECRET are set via `fly secrets set ...` —
# never commit secrets here.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # cost saving: idle apps stop, wake on request
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[deploy]
  release_command = "alembic upgrade head"
